version: 2
updates:
  # Node dependencies (build/dev tooling — the plugin coordinator itself ships
  # locked deps via package-lock.json).
  #
  # VERSION updates target `dev`, the integration branch, and reach `main` with
  # the next release merge like every other change. SECURITY updates ignore
  # `target-branch` and this entry's labels and commit-message settings: they
  # always open against the default branch (`main`), because Dependabot builds
  # its dependency graph from the default branch only.
  # .github/workflows/forward-merge-main.yml carries those main-only merges
  # back to `dev`.
  #
  # Expect one duplicate shape: an advisory on a DIRECT dependency raises a
  # security PR on `main` (to the minimum patched version) while this entry
  # raises a version PR on `dev` (to the latest). The two touch the same
  # package-lock.json lines, so the forward-merge conflicts; keep `dev`'s side
  # when its version is at or above `main`'s.
  #
  # Moving version updates to `dev` takes away no human review. What merges
  # without a human is decided by dependabot-automerge.yml's gate (npm
  # devDependency patch/minor bumps only), the same on either branch; on
  # `main` its own github-actions[bot] approval met the one required review for
  # exactly those PRs. It does keep unreviewed bumps off `main`, the branch an
  # unpinned marketplace install tracks.
  #
  # This file is read from the default branch, so a change here takes effect
  # only once it reaches `main`.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"

  # GitHub Actions workflow versions (every file under .github/workflows/).
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
