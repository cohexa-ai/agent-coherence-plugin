name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Fail fast on manifest version drift (needs no npm install). The
      # pre-commit hook running the same check is advisory-only — v0.3.1
      # shipped with marketplace.json still at 0.3.0 because nothing in CI
      # enforced it.
      - name: Check manifest versions synced
        run: node tools/check_versions_synced.js

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The majors with better-sqlite3 prebuilts for the locked 12.x —
        # keep in sync with engines.node in package.json.
        node-version: ["22", "24", "25"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        # Skip cleanly when no compiled tests exist yet — the suite arrives
        # in a later unit; the npm `test` script (`node --test dist/test/`)
        # otherwise hard-fails with "Could not find 'dist/test/'".
        run: |
          if [ -d dist/test ] && find dist/test -name '*.js' -type f | grep -q .; then
            npm test
          else
            echo "No compiled tests in dist/test/ — skipping until the suite lands."
          fi

  zero-python-install:
    name: Zero-Python install (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every major in engines.node must hold the install-time guarantee.
        node-version: ["22", "24", "25"]

    # Decision B: the zero-Python guarantee is that `better-sqlite3` installs
    # from a prebuilt for the pinned ABIs — never falling back to node-gyp,
    # which needs Python. NODE_GYP_FORCE_PYTHON is the only HARD override
    # node-gyp honors: find-python treats npm_config_python / PYTHON as soft
    # candidates and silently falls through to the runner's /usr/bin/python3
    # when they are invalid ("ignore errors, keep trying until Python is
    # found") — which let a source-build fallback pass this job unnoticed.
    # With FORCE set to a bad path it becomes the SOLE candidate, so any
    # node-gyp invocation dies immediately. The soft masks stay as
    # defense-in-depth. The runtime smoke test can't catch this; the install
    # must (plus the config.gypi assertion in zero_python_smoke.test.ts).
    #
    # npm 11 gates package install scripts behind an allowScripts allowlist.
    # That gate only WARNS by default, so this job would sail past it — but
    # better-sqlite3's install script IS `prebuild-install`, the prebuilt
    # download itself. A user whose npmrc sets strict-allow-scripts gets a
    # hard ESTRICTALLOWSCRIPTS failure, and one with ignore-scripts gets a
    # silently binary-less tree. Turning strict ON here makes package.json's
    # allowScripts entry a tested contract instead of a hope: any dependency
    # that grows an install script fails this job until it is covered
    # explicitly. npm 10 (Node 22's bundled npm) does not know the config
    # and ignores it, so the matrix stays green either way.
    env:
      npm_config_python: /nonexistent
      PYTHON: /nonexistent
      NODE_GYP_FORCE_PYTHON: /nonexistent
      npm_config_strict_allow_scripts: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install (prebuilt-only — no Python for node-gyp)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Zero-Python smoke + install-time assertion
        env:
          ZERO_PYTHON_INSTALL_CHECK: "1"
        run: |
          if [ -d dist/test ] && find dist/test -name '*.js' -type f | grep -q .; then
            npm test
          else
            echo "No compiled tests in dist/test/ — skipping."
          fi

  marketplace-provision:
    name: Marketplace-shaped provision (dist-less package)
    runs-on: ubuntu-latest

    # Every other job runs `npm ci` + `npm run build` before touching the
    # bootstrap — but a marketplace install is a git clone, and dist/ is
    # gitignored, so the shipped package NEVER contains compiled output.
    # v0.2.1/v0.3.1 shipped with a SessionStart bootstrap that spawned the
    # nonexistent dist/coordinator.js, reported success, and crash-looped
    # MODULE_NOT_FOUND forever. This job runs the real SessionStart entry
    # point against a `git archive` tree (exactly the marketplace shape,
    # with NO package-side npm install) and requires a LIVE coordinator.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Materialize the marketplace-shaped package (tracked files only)
        run: |
          mkdir -p /tmp/plugin-pkg
          git archive HEAD | tar -x -C /tmp/plugin-pkg
          test ! -d /tmp/plugin-pkg/dist
          test ! -d /tmp/plugin-pkg/node_modules

      - name: SessionStart bootstrap must yield a LIVE coordinator
        run: |
          export CLAUDE_PLUGIN_ROOT=/tmp/plugin-pkg
          export CLAUDE_PLUGIN_DATA=/tmp/plugin-data
          mkdir -p /tmp/ws && cd /tmp/ws && git init -q .
          set +e
          bash "$CLAUDE_PLUGIN_ROOT/bin/ensure-coordinator-dispatch" >hook.out 2>hook.err
          ec=$?
          set -e
          echo "--- hook stdout ---"; cat hook.out
          echo "--- hook stderr ---"; cat hook.err
          test "$ec" -eq 0
          grep -q "spawned Node coordinator" hook.err
          test -f /tmp/plugin-data/dist/coordinator.js
          pid=$(sed -n 's/.*pid=\([0-9]\{1,\}\).*/\1/p' hook.err | head -1)
          sleep 2
          kill -0 "$pid"
          echo "--- workspace .coherence after boot ---"; ls -la .coherence 2>/dev/null || true
          # First provision must stamp the backend so the dispatcher's
          # state.db guard cannot reroute session 2 to the python default.
          test "$(cat .coherence/coordinator_backend)" = "node"
          # The hook client must resolve its Node client from the provisioned
          # PLUGIN_DATA dist (the package has none) and complete a real wire
          # round-trip — a fresh pre-read of a default-tracked artifact.
          echo hello > CLAUDE.md
          printf '{"session_id":"44444444-4444-4444-8444-444444444444","tool_input":{"file_path":"%s/CLAUDE.md"}}' "$PWD" \
            | bash "$CLAUDE_PLUGIN_ROOT/bin/hook-client" pre-read > client.out
          echo "--- hook-client pre-read ---"; cat client.out
          grep -q "fresh" client.out
          # Session 2 (same boot): dispatcher must stay on node and attach.
          bash "$CLAUDE_PLUGIN_ROOT/bin/ensure-coordinator-dispatch" 2>hook2.err
          echo "--- session 2 stderr ---"; cat hook2.err
          grep -q "coordinator already running" hook2.err
          # "Reboot": kill the coordinator; the next session must re-spawn
          # the NODE coordinator (not silently fall back to python).
          kill "$pid"; sleep 1
          bash "$CLAUDE_PLUGIN_ROOT/bin/ensure-coordinator-dispatch" 2>hook3.err
          echo "--- session 3 stderr ---"; cat hook3.err
          grep -q "spawned Node coordinator" hook3.err
          pid3=$(sed -n 's/.*pid=\([0-9]\{1,\}\).*/\1/p' hook3.err | head -1)
          kill "$pid3"

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [typecheck, test, zero-python-install]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build distribution
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7
