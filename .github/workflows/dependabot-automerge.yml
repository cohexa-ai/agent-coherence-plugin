# Auto-merge policy for Dependabot PRs. VERSION updates target `dev` per
# .github/dependabot.yml; SECURITY updates always target the default branch,
# `main`. This workflow runs on both.
#
# Scope — auto-approved + auto-merged once every required status check on the
# PR's base branch passes (branch protection stays the real gate; auto-merge
# only queues the merge):
#   - GitHub Actions bumps (every workflow under .github/workflows/), EXCEPT
#     actions/create-github-app-token. That action receives the forward-merge
#     App's private key (forward-merge-main.yml), and `dev` needs no review, so
#     auto-merging a new pin of it would hand the key to code no human has
#     looked at. Its bumps wait for a human like any other. It is the only
#     third-party action in that job; the job fetches with plain git rather
#     than actions/checkout so that no auto-merged action runs beside the key.
#   - npm devDependencies (direct:development), semver patch + minor only
#
# Everything else — production dependencies (better-sqlite3 is deliberately
# pinned to the 12.x prebuilt line: its ABI coverage defines engines.node
# and the ensure-coordinator-node stage-0 gate) and any semver-major bump —
# gets no approval here and waits for a human.
#
# A merge that lands on `main` reaches `dev` through
# .github/workflows/forward-merge-main.yml. A merge made by this workflow uses
# GITHUB_TOKEN and so fires no push-triggered workflow; that workflow's daily
# schedule is what picks it up.
name: Dependabot auto-merge

on: pull_request

# `actions: write` is what lets auto-merge go through on a GitHub Actions bump.
# Every such PR edits a file under .github/workflows/, and without it GitHub
# refuses to enable auto-merge ("refusing to allow a GitHub App to create or
# update workflow ... without `workflows` permission"). GITHUB_TOKEN has no
# `workflows` key. `actions: write` is the fix reported in cli/cli#11493 and
# confirmed there by a second user; GitHub does not document it, so treat it
# as a workaround and watch the first Actions bump on `dev`.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  automerge:
    name: Auto-merge safe bumps
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # --squash: a dependency bump is one logical change, and both bases
      # accept it (`dev` has no merge-method rule; the `protect-main` ruleset
      # allows merge and squash).
      #
      # The approval is best-effort. `main` needs one approving review, `dev`
      # needs none. It succeeds only while the repo setting "Allow GitHub
      # Actions to create and approve pull requests" is on; with it off,
      # `gh pr review --approve` fails with "GitHub Actions is not permitted to
      # approve pull requests", and that must not fail the job, or the workflow
      # is permanently red and never reaches the auto-merge call. A `main` PR
      # then waits for one human approval and auto-merge does the rest.
      - name: Approve (best-effort) and enable auto-merge — actions + dev-deps, patch/minor
        if: >-
          !contains(steps.metadata.outputs.dependency-names, 'actions/create-github-app-token') &&
          (steps.metadata.outputs.package-ecosystem == 'github_actions' ||
           steps.metadata.outputs.dependency-type == 'direct:development') &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if ! gh pr review --approve "$PR_URL"; then
            echo "::notice::Actions approval not permitted; this PR still needs one human approval. Auto-merge is queued and fires once it lands."
          fi
          gh pr merge --auto --squash "$PR_URL"
