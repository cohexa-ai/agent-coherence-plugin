# Auto-merge policy for Dependabot PRs. VERSION updates target `dev` per
# .github/dependabot.yml; SECURITY updates always target the default branch,
# `main`. This workflow runs on both.
#
# Scope — auto-approved + auto-merged once every required status check on the
# PR's base branch passes (branch protection stays the real gate; auto-merge
# only queues the merge): npm devDependencies (direct:development), semver
# patch + minor only.
#
# Everything else gets no approval here and waits for a human:
#   - production dependencies (better-sqlite3 is deliberately pinned to the
#     12.x prebuilt line: its ABI coverage defines engines.node and the
#     ensure-coordinator-node stage-0 gate);
#   - any semver-major bump;
#   - every GitHub Actions bump. An action is third-party code that runs inside
#     the workflows, some of which hold write tokens or, in
#     forward-merge-main.yml, the App's private key, and `dev` takes merges
#     with no review. A human reading the new pin is the only review it gets.
#     (In practice none ever auto-merged before either: GitHub refuses to
#     enable auto-merge with this token on a PR that edits a workflow file.)
#
# A merge that lands on `main` reaches `dev` through
# .github/workflows/forward-merge-main.yml. A merge made by this workflow uses
# GITHUB_TOKEN and so fires no push-triggered workflow; that workflow's
# schedule is what picks it up.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge safe bumps
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # --squash: a dependency bump is one logical change, and both bases
      # accept it (`dev` has no merge-method rule; the `protect-main` ruleset
      # allows merge and squash).
      #
      # The approval is best-effort. `main` needs one approving review, `dev`
      # needs none. It succeeds only while the repo setting "Allow GitHub
      # Actions to create and approve pull requests" is on; with it off,
      # `gh pr review --approve` fails with "GitHub Actions is not permitted to
      # approve pull requests", and that must not fail the job, or the workflow
      # is permanently red and never reaches the auto-merge call. A `main` PR
      # then waits for one human approval and auto-merge does the rest.
      - name: Approve (best-effort) and enable auto-merge — npm dev-deps, patch/minor
        if: >-
          steps.metadata.outputs.dependency-type == 'direct:development' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if ! gh pr review --approve "$PR_URL"; then
            echo "::notice::Actions approval not permitted; this PR still needs one human approval. Auto-merge is queued and fires once it lands."
          fi
          gh pr merge --auto --squash "$PR_URL"
